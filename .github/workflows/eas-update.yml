# DISABLED until EAS Update is configured for this project.
#
# This workflow cannot succeed yet: the `expo-updates` package is not installed
# and app.json has no `updates` / `runtimeVersion` config, so `eas update` has
# nothing to publish to.
#
# To enable:
#   1. cd CompuClass-v.1.0-main && eas update:configure
#      (installs expo-updates, adds runtimeVersion + updates.url to app.json)
#   2. Commit the resulting changes.
#   3. Add `push: branches: [main]` back to the triggers below.
#
# Until then it only runs when triggered by hand, so it never reports red.
name: EAS Update (OTA)

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: CompuClass-v.1.0-main

jobs:
  eas-update:
    name: Publish OTA update to production channel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: CompuClass-v.1.0-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update
        run: eas update --branch production --message "CI update from ${{ github.sha }}" --non-interactive
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
