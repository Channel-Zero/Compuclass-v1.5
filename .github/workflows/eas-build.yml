# Android-only by default. iOS device builds require a paid Apple Developer
# account ($99/yr); add 'ios' via the manual run inputs once that exists.
#
# NOTE: EAS free tier has a limited number of builds per month. Pushes to
# test_branch use the cheaper 'preview' profile; only main builds 'production'.
name: EAS Build (Android)

on:
  push:
    branches: [main, test_branch]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'android'
        type: choice
        options: [android, ios, all]
      profile:
        description: 'EAS build profile'
        required: true
        default: 'preview'
        type: choice
        options: [preview, production, development]

defaults:
  run:
    working-directory: CompuClass-v.1.0-main

jobs:
  eas-build:
    name: Trigger EAS cloud build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: CompuClass-v.1.0-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Resolve build profile
        id: profile
        run: |
          if [ -n "${{ github.event.inputs.profile }}" ]; then
            echo "value=${{ github.event.inputs.profile }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "value=production" >> "$GITHUB_OUTPUT"
          else
            echo "value=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger EAS build
        run: eas build --platform ${{ github.event.inputs.platform || 'android' }} --profile ${{ steps.profile.outputs.value }} --non-interactive --no-wait
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
